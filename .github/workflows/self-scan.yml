name: ACE Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint deps
        run: pip install ruff

      - name: Run ruff check
        run: ruff check services/ cli/ infra/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ACE deps
        run: pip install -r services/ace/requirements.txt

      - name: Install RHG deps
        run: pip install -r services/rhg/requirements.txt

      - name: Install CLI
        run: pip install -e cli/

      - name: Debug — list installed packages
        run: pip list --format=columns

      - name: Run ACE tests with coverage
        run: |
          cd services/ace
          python -m pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml:../../coverage-ace.xml
          echo "ACE_TEST_EXIT=$?" >> $GITHUB_ENV

      - name: Run RHG tests
        run: |
          cd services/rhg
          python -m pytest tests/ -v
          echo "RHG_TEST_EXIT=$?" >> $GITHUB_ENV

      - name: Run CLI tests
        run: |
          cd cli
          python -m pytest tests/ -v
          echo "CLI_TEST_EXIT=$?" >> $GITHUB_ENV

      - name: Run Lambda tests
        run: |
          cd infra/aws_lambda
          python -m pytest tests/ -v
          echo "LAMBDA_TEST_EXIT=$?" >> $GITHUB_ENV

      - name: Upload ACE coverage
        uses: actions/upload-artifact@v4
        with:
          name: ace-coverage
          path: coverage-ace.xml

      - name: Fail if any test suite failed
        if: ${{ env.ACE_TEST_EXIT != '0' || env.RHG_TEST_EXIT != '0' || env.CLI_TEST_EXIT != '0' || env.LAMBDA_TEST_EXIT != '0' }}
        run: |
          echo "=== Test results ==="
          echo "ACE:    ${{ env.ACE_TEST_EXIT == '0' && 'PASS' || 'FAIL' }}"
          echo "RHG:    ${{ env.RHG_TEST_EXIT == '0' && 'PASS' || 'FAIL' }}"
          echo "CLI:    ${{ env.CLI_TEST_EXIT == '0' && 'PASS' || 'FAIL' }}"
          echo "Lambda: ${{ env.LAMBDA_TEST_EXIT == '0' && 'PASS' || 'FAIL' }}"
          exit 1

  ace-scan:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start ACE service
        run: |
          cd services/ace
          pip install -r requirements.txt
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -s http://127.0.0.1:8000/health || echo "ACE not healthy — scan may still proceed"

      - name: ACE Compliance Scan
        uses: ./.github/actions/ace-scan
        with:
          artifacts-path: policies/
          fail-on: HIGH
