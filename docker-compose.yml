services:
  opa:
    image: openpolicyagent/opa:0.63.0
    command: run --server --addr=0.0.0.0:8181 --set=decision_logs.console=true /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  ace:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPA_URL: http://opa:8181
      REDIS_URL: redis://redis:6379
      ACE_METRICS_PORT: "9090"
      ACE_METRICS_ENABLED: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      opa:
        condition: service_healthy
      redis:
        condition: service_healthy

  rhg:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      ACE_URL: http://ace:8000
      BLOCK_ON_SEVERITY: HIGH
      MAX_MUTATION_RETRIES: "3"
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://dashboard:3000
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SQS_ALERT_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/123/ace-alerts.fifo
    depends_on:
      ace:
        condition: service_started
      redis:
        condition: service_healthy