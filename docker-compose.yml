services:
  opa:
    image: openpolicyagent/opa:0.63.0
    command: run --server --addr=0.0.0.0:8181 --set=decision_logs.console=true /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    # No healthcheck: the OPA image is scratch-based and has no sh/wget.
    # ACE checks OPA health per request and returns 503 until it is up.

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  ace:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn ace.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OPA_URL: http://opa:8181
      REDIS_URL: redis://redis:6379
      ACE_METRICS_PORT: "9090"
      ACE_METRICS_ENABLED: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-nebius}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.studio.nebius.ai/v1}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      AGENT_CONFIDENCE_THRESHOLD: ${AGENT_CONFIDENCE_THRESHOLD:-0.85}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      opa:
        condition: service_started
      redis:
        condition: service_healthy

  rhg:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn rhg.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./services/rhg:/var/task/rhg
    ports:
      - "8001:8001"
    environment:
      ACE_URL: http://ace:8000
      BLOCK_ON_SEVERITY: HIGH
      MAX_MUTATION_RETRIES: "3"
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: http://dashboard:3000
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SQS_ALERT_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/123/ace-alerts.fifo
    depends_on:
      ace:
        condition: service_healthy
      redis:
        condition: service_healthy