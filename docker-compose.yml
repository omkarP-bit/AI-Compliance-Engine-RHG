services:
  opa:
    image: openpolicyagent/opa:0.63.0
    command: run --server --addr=0.0.0.0:8181 --set=decision_logs.console=true /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    # No healthcheck: the OPA image is scratch-based and has no sh/wget.
    # ACE checks OPA health per request and returns 503 until it is up.

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  ace:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn ace.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OPA_URL: http://opa:8181
      REDIS_URL: redis://redis:6379
      ACE_METRICS_PORT: "9090"
      ACE_METRICS_ENABLED: "true"
      API_MIN_SEVERITY: ${API_MIN_SEVERITY:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-nebius}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.studio.nebius.ai/v1}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      AGENT_CONFIDENCE_THRESHOLD: ${AGENT_CONFIDENCE_THRESHOLD:-0.85}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-3}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      NOTIFY_ON_SEVERITY: ${NOTIFY_ON_SEVERITY:-CRITICAL,HIGH}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OPS_EMAIL_LIST: ${OPS_EMAIL_LIST:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      opa:
        condition: service_started
      redis:
        condition: service_healthy

  rhg:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn rhg.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./services/rhg:/var/task/rhg
    ports:
      - "8001:8001"
    environment:
      ACE_URL: http://ace:8000
      BLOCK_ON_SEVERITY: ${BLOCK_ON_SEVERITY:-HIGH}
      API_MIN_SEVERITY: ${API_MIN_SEVERITY:-INFO}
      MAX_MUTATION_RETRIES: "3"
      REDIS_URL: redis://redis:6379
      RHG_METRICS_PORT: "9091"
      RHG_METRICS_ENABLED: "true"
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SQS_ALERT_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/123/ace-alerts.fifo
    depends_on:
      ace:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ace
      - rhg

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data: