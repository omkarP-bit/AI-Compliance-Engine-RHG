[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-compliance"
version = "0.1.0"
description = "ACE+RHG CLI — scan infrastructure artifacts for compliance violations"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ace = "ace_compliance.cli:cli"

[tool.setuptools.packages.find]
include = ["ace_compliance*"]
